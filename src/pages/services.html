title: Services — Chrisentia Consultancy

canonicalPath: services.html

<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  {{> head}}
</head>

<body data-page="services.html" class="site">

  <a href="#main" class="skip-link">Skip to content</a>

  {{> nav}}

  <main id="main">

    <!-- Page title and services -->
    <section id="services" class="section section--tint section--page reveal">
      <div class="wrap">
        <div class="section-head section-head--page">
          <p class="section-kicker">Services</p>
          <h1 class="page-title">Intelligence, applied to production</h1>
          <p class="section-sub">
            Seven capabilities, combined as each operation requires, from a single vision cell to a connected plant.
          </p>
        </div>

        <div class="services-grid">
          {{servicesGrid}}
        </div>
      </div>
    </section>

    <!-- How we work -->
    <section id="process" class="section section--dark process-band reveal">
      <div class="wrap">
        <div class="section-head">
          <p class="section-kicker">{{processKicker}}</p>
          <h2 class="section-title">{{processHeadline}}</h2>
        </div>
        <ol class="process-steps">
          {{processSteps}}
        </ol>
      </div>
    </section>

    {{> contact}}

  </main>

  {{> footer}}

  <script src="assets/js/main.js"></script>
</body>

</html>
