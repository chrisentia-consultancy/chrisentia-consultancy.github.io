<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  {{> head}}
</head>

<body data-page="{{canonicalPath}}"
  class="bg-gradient-to-br from-white via-gray-50 to-gray-100 text-on-surface font-body-lg overflow-x-hidden">

  <a href="#main"
    class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:top-4 focus:left-4 focus:bg-white focus:text-slate-800 focus:px-4 focus:py-2 focus:rounded-full focus:font-bold focus:shadow-lg">Skip
    to content</a>

  {{> nav}}

  <main id="main">

    <section class="pt-36 pb-6 px-4 md:px-16">
      <div class="max-w-5xl mx-auto">
        <a href="solutions.html"
          class="inline-flex items-center gap-2 text-sm font-bold text-on-surface-variant hover:text-slate-800 transition-colors mb-8">
          <span class="material-symbols-outlined text-base" aria-hidden="true">arrow_back</span>
          All projects
        </a>

        <div class="project-tags mb-6">
          {{projectTags}}
        </div>

        <h1 class="font-h1 text-4xl md:text-6xl font-bold mb-6">{{projectTitle}}</h1>
        <p class="text-xl text-on-surface-variant max-w-3xl">{{projectCardLine}}</p>
      </div>
    </section>

    <section class="pb-16 px-4 md:px-16">
      <div class="max-w-5xl mx-auto">
        {{projectMedia}}
      </div>
    </section>

    <section class="pb-24 px-4 md:px-16">
      <div class="max-w-3xl mx-auto project-prose">
        {{projectBody}}
      </div>
    </section>

    <section class="pb-24 px-4 md:px-16">
      <div class="max-w-5xl mx-auto">
        <h2 class="font-h2 text-2xl md:text-3xl font-bold mb-8">Other projects</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          {{projectSiblings}}
        </div>
      </div>
    </section>

    {{> contact}}

  </main>

  {{> footer}}

  <script src="assets/js/main.js"></script>
</body>

</html>
