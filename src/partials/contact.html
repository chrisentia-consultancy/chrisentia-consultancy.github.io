<section id="enquiry" class="section section--plain reveal">
  <div class="wrap">

    <div class="section-head">
      <p class="section-kicker">Contact</p>
      <h2 class="section-title">Get in touch</h2>
      <p class="section-sub">
        Describe the problem you are looking to solve and we will come back with how we would approach it.
      </p>
    </div>

    <div class="contact-grid">

      <form id="enquiryForm" action="https://formspree.io/f/{{site.formspreeId}}" method="POST" class="contact-card contact-form">

        <div class="contact-form__row">
          <div class="field">
            <label for="name">Name <span class="field__req" aria-hidden="true">*</span></label>
            <input type="text" id="name" name="name" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" autocomplete="organization" />
          </div>
        </div>

        <div class="contact-form__row">
          <div class="field">
            <label for="email">Email <span class="field__req" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>
        </div>

        <div class="field">
          <label for="message">Project details <span class="field__req" aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="5" required
            placeholder="Briefly describe the process and what you would like to improve."></textarea>
        </div>

        <!-- Honeypot: bots fill this, people never see it. -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden" />

        <button type="submit" class="btn btn--primary">
          Send enquiry
        </button>

        <p id="formStatus" role="status" aria-live="polite" class="contact-form__status"></p>
      </form>

      <div class="contact-card contact-direct">
        <h3 class="card-title">Prefer to talk?</h3>

        <a href="https://wa.me/{{site.whatsapp}}" target="_blank" rel="noopener noreferrer" class="btn btn--whatsapp">
          <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884a9.82 9.82 0 016.988 2.896 9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.359.101 11.945c0 2.096.549 4.142 1.595 5.945L0 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.582 0 11.941-5.359 11.944-11.945a11.864 11.864 0 00-3.417-8.4" />
            </svg>
          WhatsApp us
        </a>

        <ul class="contact-direct__list">
          <li>
            <span class="material-symbols-outlined" aria-hidden="true">mail</span>
            <a href="mailto:{{site.email}}">{{site.email}}</a>
          </li>
          {{contactPhoneList}}
        </ul>
      </div>

    </div>
  </div>
</section>
