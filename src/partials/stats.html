<section class="section section--tint stats-section reveal" aria-labelledby="stats-heading">
  <div class="wrap">

    <div class="section-head">
      <p class="section-kicker">Track record</p>
      <h2 id="stats-heading" class="section-title">Built on delivered work</h2>
    </div>

    <div class="stats-grid">

      <div class="stat" data-delay="0">
        <div class="stat__ring">
          <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <circle class="stat__track" cx="60" cy="60" r="54" />
            <circle class="stat__arc" cx="60" cy="60" r="54" pathLength="100" />
          </svg>
          <div class="stat__value">
            <span data-target="{{site.stats.clients}}">0</span><span class="stat__suffix">+</span>
          </div>
        </div>
        <h3 class="stat__label">Clients Served</h3>
        <p class="stat__note">Across agriculture, manufacturing, food and consumer goods</p>
      </div>

      <div class="stat" data-delay="220">
        <div class="stat__ring">
          <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <circle class="stat__track" cx="60" cy="60" r="54" />
            <circle class="stat__arc" cx="60" cy="60" r="54" pathLength="100" />
          </svg>
          <div class="stat__value">
            <span data-target="{{site.stats.projects}}">0</span><span class="stat__suffix">+</span>
          </div>
        </div>
        <h3 class="stat__label">Projects Delivered</h3>
        <p class="stat__note">Completed and in progress</p>
      </div>

      <div class="stat" data-delay="440">
        <div class="stat__ring">
          <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <circle class="stat__track" cx="60" cy="60" r="54" />
            <circle class="stat__arc" cx="60" cy="60" r="54" pathLength="100" />
          </svg>
          <div class="stat__value">
            <span data-target="{{site.stats.experts}}">0</span><span class="stat__suffix">+</span>
          </div>
        </div>
        <h3 class="stat__label">Engineers &amp; Specialists</h3>
        <p class="stat__note">Across mechatronics, data science and software</p>
      </div>

    </div>
  </div>
</section>
