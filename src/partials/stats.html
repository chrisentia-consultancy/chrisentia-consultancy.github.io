<section class="py-20 px-4 md:px-16 reveal">
  <div class="max-w-6xl mx-auto">
    <div class="stats-band glass-panel rounded-[2rem] md:rounded-[3rem] px-6 py-12 md:px-16 md:py-14">

      <div class="stat" data-delay="0">
        <div class="stat__value">
          <span data-target="{{site.stats.clients}}">0</span><span class="stat__suffix">+</span>
        </div>
        <div class="stat__label">Clients Served</div>
      </div>

      <div class="stat" data-delay="150">
        <div class="stat__value">
          <span data-target="{{site.stats.projects}}">0</span><span class="stat__suffix">+</span>
        </div>
        <div class="stat__label">Projects Delivered</div>
      </div>

      <div class="stat" data-delay="300">
        <div class="stat__value">
          <span data-target="{{site.stats.experts}}">0</span>
        </div>
        <div class="stat__label">Engineers &amp; Specialists</div>
      </div>

    </div>
  </div>
</section>
