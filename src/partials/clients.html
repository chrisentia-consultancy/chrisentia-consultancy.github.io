<section id="clients" class="py-20 px-4 md:px-16 bg-white border-y border-gray-100 reveal">
  <div class="max-w-7xl mx-auto">

    <div class="text-center max-w-2xl mx-auto mb-12">
      <p class="text-xs tracking-widest uppercase font-black text-slate-500 mb-3">Trusted by</p>
      <h2 class="font-h1 text-3xl md:text-4xl font-bold">Teams we've built for</h2>
    </div>

    <!-- Scrolls automatically, pauses on hover/focus, falls back to a static
         wrapped row when the visitor has reduced motion turned on. -->
    <div class="logo-marquee" role="list" aria-label="Our clients">
      <div class="logo-marquee__track">
        {{clientLogos}}
      </div>
    </div>

  </div>
</section>
