<section id="clients" class="section section--plain clients-section reveal">
  <div class="wrap">
    <div class="section-head">
      <p class="section-kicker">Clients &amp; Partners</p>
      <h2 class="section-title">Teams we build for</h2>
    </div>
  </div>

  <!-- Scrolls on its own, pauses under the mouse or keyboard focus.
       With reduced motion turned on it becomes a row you scroll yourself. -->
  <div class="client-scroller" role="region" aria-label="Clients and partners" tabindex="0">
    <div class="client-scroller__track" style="--scroll-time: {{clientScrollSeconds}}s">
        {{clientCards}}
    </div>
  </div>
</section>
