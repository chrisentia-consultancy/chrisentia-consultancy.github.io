<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{site.url}}/{{canonicalPath}}" />

<!-- Open Graph / social sharing. Without these the site shares as a blank card. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{site.name}}" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{site.url}}/{{canonicalPath}}" />
<meta property="og:image" content="{{site.url}}/{{site.logo}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{site.url}}/{{site.logo}}" />

<link rel="icon" type="image/jpeg" href="{{site.logo}}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;900&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
  rel="stylesheet" />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/main.css" />

<!-- LocalBusiness structured data: tells Google this is a real company with a
     real address, which matters for local search in Sri Lanka. -->
<script type="application/ld+json">
{{structuredData}}
</script>
